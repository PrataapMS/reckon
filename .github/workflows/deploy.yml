name: Deploy (production)
# Deploys only on a major version tag (vN.0.0), and only after approval
# on the `production` environment. Netlify's own Git builds are disabled in netlify.toml.
on:
  push:
    tags: ["v[0-9]+.0.0"]

concurrency: deploy-production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require a major version tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[1-9][0-9]*\.0\.0$ ]] || { echo "Not a major version tag: $GITHUB_REF_NAME"; exit 1; }
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: pnpm dlx netlify-cli@27 deploy --build --prod --message "$GITHUB_REF_NAME"
