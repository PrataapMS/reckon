name: Database backup (nightly)
on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg_dump 16 and age
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16 age
      - name: Dump, compress and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y%m%dT%H%M%SZ)
          /usr/lib/postgresql/16/bin/pg_dump "$DATABASE_URL" --no-owner --format=custom \
            | gzip -9 | age -r "$BACKUP_AGE_RECIPIENT" > "reckon-$stamp.dump.gz.age"
          ls -lh reckon-*.age
      - uses: actions/upload-artifact@v4
        with:
          name: reckon-db-backup
          path: reckon-*.age
          retention-days: 30
