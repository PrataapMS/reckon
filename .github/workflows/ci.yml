name: CI
on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: reckon, POSTGRES_PASSWORD: reckon, POSTGRES_DB: reckon }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reckon" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://reckon:reckon@localhost:5432/reckon
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm test
      - name: Integration tests (migrations, triggers, queue)
        run: pnpm db:migrate && pnpm db:seed && pnpm test:integration
      - run: pnpm build

  e2e:
    # Phase 1 acceptance: onboarding → brief → reveal on a fake clock, light and dark, with axe-core.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reckon/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
