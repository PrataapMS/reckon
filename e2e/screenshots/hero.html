<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
  /* README banner (1280x640, also the GitHub social preview). Rendered by readme.spec.ts. */
  :root { --bg: #0B0D17; --surface: #151829; --line: #252A45; --text: #F2F3FA; --muted: #A3A7C2; }
  :root.light { --bg: #F7F7FB; --surface: #FFFFFF; --line: #E3E4EF; --text: #14162B; --muted: #5B5F7A; }
  * { box-sizing: border-box; margin: 0; }
  html { overflow: hidden; }
  body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; position: relative; }
  .glow { position: absolute; inset: 0; background:
    radial-gradient(600px 400px at 85% 30%, rgba(99,102,241,.28), transparent 70%),
    radial-gradient(500px 360px at 60% 100%, rgba(14,165,233,.22), transparent 70%),
    radial-gradient(420px 300px at 100% 95%, rgba(249,115,22,.16), transparent 70%); }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 520px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 72px; height: 72px; }
  .brand span { font: 700 64px/1 "Space Grotesk", sans-serif; letter-spacing: -0.02em; }
  h1 { margin-top: 28px; font: 700 44px/1.1 "Space Grotesk", sans-serif; letter-spacing: -0.02em;
       background: linear-gradient(90deg, #0EA5E9, #6366F1 55%, #EC4899); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin-top: 20px; font-size: 21px; line-height: 1.5; color: var(--muted); }
  .chips { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; font-size: 15px; font-weight: 500; }
  .chip i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
  .phones { position: absolute; left: 610px; top: 0; width: 640px; height: 640px; }
  .phone { position: absolute; width: 236px; border-radius: 34px; padding: 8px; background: #1d2036; box-shadow: 0 30px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06); }
  :root.light .phone { background: #d9dbe8; box-shadow: 0 30px 60px rgba(20,22,43,.22), 0 0 0 1px rgba(20,22,43,.06); }
  .phone img { display: block; width: 100%; border-radius: 27px; }
  .p1 { left: 0; top: 110px; transform: rotate(-6deg); }
  .p2 { left: 185px; top: 52px; z-index: 2; }
  .p3 { left: 370px; top: 110px; transform: rotate(6deg); }
</style>
</head>
<body>
<div class="glow"></div>
<div class="copy">
  <div class="brand"><img src="../../apps/web/public/icon.svg" alt="" /><span>Reckon</span></div>
  <h1>Reality keeps score.</h1>
  <p>Small, concrete predictions about your day. Every one locked in advance, checked against public data, and scored in the open.</p>
  <div class="chips">
    <span class="chip"><i style="background:linear-gradient(135deg,#0EA5E9,#6366F1)"></i>Weather</span>
    <span class="chip"><i style="background:linear-gradient(135deg,#F59E0B,#A855F7)"></i>Air quality</span>
    <span class="chip"><i style="background:linear-gradient(135deg,#10B981,#14B8A6)"></i>Money</span>
    <span class="chip"><i style="background:linear-gradient(135deg,#6366F1,#EC4899)"></i>Tech</span>
    <span class="chip"><i style="background:linear-gradient(135deg,#F97316,#EF4444)"></i>Space &amp; world</span>
  </div>
</div>
<div class="phones">
  <div class="phone p1"><img data-shot="reveal" alt="The Reveal screen" /></div>
  <div class="phone p2"><img data-shot="today" alt="Today screen" /></div>
  <div class="phone p3"><img data-shot="scoreboard" alt="Scoreboard screen" /></div>
</div>
<script>
  const theme = new URLSearchParams(location.search).get('theme') || 'dark';
  document.documentElement.classList.toggle('light', theme === 'light');
  for (const img of document.querySelectorAll('img[data-shot]')) img.src = `../../docs/assets/screens/${theme}-${img.dataset.shot}.png`;
</script>
</body>
</html>
