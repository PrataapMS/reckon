# Local Postgres for development and integration tests.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: reckon
      POSTGRES_PASSWORD: reckon
      POSTGRES_DB: reckon
    ports:
      - "5432:5432"
    volumes:
      - reckon-db:/var/lib/postgresql/data
volumes:
  reckon-db:
